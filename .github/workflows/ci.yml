name: Verify workbench
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: local-pit-crew/web/package-lock.json
      - run: npm ci --ignore-scripts --prefix local-pit-crew/web
      - run: npm ci --ignore-scripts --prefix local-pit-crew/runner
      - name: Audit web runtime dependencies
        run: npm audit --omit=dev --prefix local-pit-crew/web
      - name: Audit function runner dependencies
        run: npm audit --omit=dev --prefix local-pit-crew/runner
      - run: npm run build:firebase
      - run: git diff --exit-code -- local-pit-crew/ui/public/firebase-planner.mjs local-pit-crew/ui/public/firebase-bundle.json
      - run: npm test
      - run: npm run build:web
      - run: npm run test:web
      - run: npm run test:runner
      - run: npm run audit:public -- --tree-only
  docker-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm run test:runner:admission
        env:
          PITCREW_DOCKER_SOCKET: /var/run/docker.sock
  checkout-contract-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check the corrected checkout
        uses: ./
        with:
          contract: examples/checkout/function.contract.json
          source: examples/checkout/shipping-quote.js
          contract-sha256: ae71ce4c7536324acc1bc89cb11a471f7ebe33bfa6508e5769ffb4fc34e5b139
      - name: Require the recorded draft to fail case-05
        run: |
          node -e 'const fs = require("node:fs"); const packet = JSON.parse(fs.readFileSync("examples/checkout/gemini-draft.replay.json", "utf8")); fs.writeFileSync("checkout-draft.cjs", packet.files[0].content, {flag: "wx"});'
          status=0
          node scripts/replay-function.cjs --contract examples/checkout/function.contract.json --source checkout-draft.cjs > checkout-draft-result.json || status=$?
          test "$status" -eq 1
          node -e '
            const assert = require("node:assert/strict");
            const {checks, failures, status} = require("./checkout-draft-result.json");
            assert.equal(status, "checked");
            assert.deepEqual(checks.filter(check => !check.ok).map(check => check.id), ["case-05"]);
            assert.deepEqual(failures, [{id:"case-05",reasons:["return-mismatch"]}]);
            console.log("The recorded draft was rejected on case-05 for a return mismatch.");
          '
      - name: Attempt the gate with case-05 removed
        run: |
          node -e 'const fs = require("node:fs"); const contract = JSON.parse(fs.readFileSync("examples/checkout/function.contract.json", "utf8")); contract.cases.pop(); fs.writeFileSync("reduced.contract.json", JSON.stringify(contract), {flag: "wx"});'
          node scripts/replay-function.cjs --contract reduced.contract.json --source checkout-draft.cjs > reduced-result.json
          node -e 'require("node:assert/strict").equal(require("./reduced-result.json").passed, 4);'
      - name: Require the pinned action to reject the reduced contract
        id: reduced
        uses: ./
        continue-on-error: true
        with:
          contract: reduced.contract.json
          source: checkout-draft.cjs
          contract-sha256: ae71ce4c7536324acc1bc89cb11a471f7ebe33bfa6508e5769ffb4fc34e5b139
      - name: Confirm verification stopped with contract drift
        env:
          GATE_OUTCOME: ${{ steps.reduced.outcome }}
          GATE_EXIT_CODE: ${{ steps.reduced.outputs.exit-code }}
        run: |
          test "$GATE_OUTCOME" = failure
          test "$GATE_EXIT_CODE" = 2
      - name: Distinguish correct returns from changed inputs
        run: |
          node -e '
            const fs = require("node:fs");
            const source = fs.readFileSync("examples/checkout/shipping-quote.js", "utf8");
            const mutation = "const reviewed = exports.shippingQuote; exports.shippingQuote = (quotes, currency) => { const result = reviewed(quotes, currency); quotes.reverse(); return result; };";
            fs.writeFileSync("checkout-mutates.cjs", source + "\n" + mutation, {flag: "wx"});
          '
          status=0
          node scripts/replay-function.cjs --contract examples/checkout/function.contract.json --source checkout-mutates.cjs > checkout-mutations.json || status=$?
          test "$status" -eq 1
          node -e '
            const assert = require("node:assert/strict");
            const {failures} = require("./checkout-mutations.json");
            assert.deepEqual(failures, ["case-01","case-02","case-03"].map(id => ({id,reasons:["inputs-changed"]})));
            console.log("The checkout returned the expected values but changed input arguments in three cases.");
          '
      - name: Verify the validator's expected error code
        uses: ./
        with:
          contract: examples/validation/function.contract.json
          source: examples/validation/normalize-slug.cjs
